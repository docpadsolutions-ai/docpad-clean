name: Database isolation tests

# The pgTAP suite asserts that no hospital can see another hospital's data, that signed-out
# visitors reach nothing but the two public RPCs, that staff cannot promote themselves, and
# that the audit trail records edits and chart opens. It runs inside a rolled-back transaction.
#
# Needs a repository secret SUPABASE_DB_URL (Supabase → Project Settings → Database →
# Connection string → URI, session pooler). Without it the job is skipped, not failed.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"

jobs:
  rls:
    name: RLS and audit assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for database secret
        id: secret
        run: echo "present=${{ secrets.SUPABASE_DB_URL != '' }}" >> "$GITHUB_OUTPUT"
      - name: Install psql
        if: steps.secret.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run supabase/tests/rls_isolation.sql
        if: steps.secret.outputs.present == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql | tee tap.out
          if grep -q "^not ok" tap.out; then
            echo "::error::RLS isolation tests failed"
            exit 1
          fi
      - name: Skipped
        if: steps.secret.outputs.present != 'true'
        run: echo "SUPABASE_DB_URL secret not set - skipping database tests."
