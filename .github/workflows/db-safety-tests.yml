name: Database safety tests

# Two pgTAP suites, both run inside a transaction that is rolled back, so they are safe
# against any environment.
#
#   clinical_safety.sql  the blocking gate Proposal v1.0 §2.1 asks for and SOW §5 lists
#                        as an acceptance criterion. Asserts that a finalised encounter
#                        cannot be edited, that a severe interaction or a matching
#                        allergy blocks the write, and that cross-reactivity advises
#                        rather than refuses. Every one of these rules lived only in the
#                        UI until 18 Sep 2026, so a browser-driven test would have
#                        passed against a product that did not enforce any of them.
#
#   rls_isolation.sql    no hospital can see another hospital's data, signed-out
#                        visitors reach nothing but the public RPCs, staff cannot
#                        promote themselves, the audit trail records edits and chart
#                        opens, and the appointment and DPDPA rules hold.
#
# It also checks that supabase/migrations and the database agree about what has been
# applied, in both directions. That check exists because nobody was watching: the folder
# had drifted to 173 files, 93 never applied anywhere, against 375 applied migrations of
# which 296 had no file at all, and nothing ever failed.
#
# IMPORTANT: this is only a gate once the repository secret SUPABASE_DB_URL is set
# (Supabase, Project Settings, Database, Connection string, URI, session pooler).
# Without it every step below is skipped and the job passes green, which is the
# failure mode the SOW's "blocking gate" language exists to prevent. The job emits a
# warning annotation in that state so it is visible on the run rather than silent.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "components/PrescriptionModal.tsx"
      - "hooks/usePrescriptionSafety.ts"

jobs:
  db:
    name: Clinical safety, tenancy and migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for database secret
        id: secret
        run: echo "present=${{ secrets.SUPABASE_DB_URL != '' }}" >> "$GITHUB_OUTPUT"

      - name: Install psql
        if: steps.secret.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Clinical safety runs first: if prescribing or the finalise lock is broken,
      # that is what the reviewer should see at the top of the log.
      - name: Clinical safety suite
        if: steps.secret.outputs.present == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinical_safety.sql | tee clinical.out
          if grep -q "^not ok" clinical.out; then
            echo "::error::Clinical safety assertions failed - do not merge"
            exit 1
          fi

      - name: Tenancy and audit suite
        if: steps.secret.outputs.present == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql | tee tap.out
          if grep -q "^not ok" tap.out; then
            echo "::error::RLS isolation assertions failed"
            exit 1
          fi

      - name: Migration drift
        if: steps.secret.outputs.present == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/check-migration-drift.mjs

      - name: Not a gate yet
        if: steps.secret.outputs.present != 'true'
        run: |
          echo "::warning title=Clinical safety gate inactive::SUPABASE_DB_URL is not set, so the clinical-safety and tenancy suites did not run. This job is passing green without asserting anything."
